name: 打包 Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 設定資料來源為這個倉庫
        run: sed -i "s#__GITHUB_REPO__#${GITHUB_REPOSITORY}#" src/config.ts && grep REMOTE src/config.ts
      - run: npm ci
      - name: 產生 Android 專案
        run: npx expo prebuild --platform android --no-install
      - name: 還原簽章金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: 編譯 APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: typhoon
        run: ./gradlew assembleRelease --no-daemon
      - name: 整理檔名
        run: cp android/app/build/outputs/apk/release/app-release.apk ../typhoon-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: typhoon-app
          path: typhoon-app.apk
      - name: 發布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 颱風戰情室 最新版
          body: |
            下載下方的 typhoon-app.apk 到 Android 手機安裝。
            第一次安裝要允許「安裝未知來源的應用程式」。
            版本：${{ github.sha }}
          files: typhoon-app.apk
          make_latest: true
